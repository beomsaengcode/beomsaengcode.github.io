<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#05070d;}canvas{display:block;}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script type="module">
import * as THREE from 'three';

const out = document.getElementById('c');
const ctx = out.getContext('2d');
const gl = document.createElement('canvas');
gl.width = 800; gl.height = 800;
const renderer = new THREE.WebGLRenderer({canvas: gl, preserveDrawingBuffer: true, antialias: true});
renderer.setPixelRatio(1);
renderer.setSize(800, 800, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

let seed = 20261225;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b16);
scene.fog = new THREE.Fog(0x070b16, 45, 95);
const camera = new THREE.PerspectiveCamera(38, 1, 1, 200);

// ---------- voxel store ----------
const S = 0.4, GY = -4, RIN = 9.45;
const W = (x, y, z) => new THREE.Vector3(x * S, GY + (y + 0.5) * S, z * S);
const vox = new Map(), glow = new Map(), halos = [];
const key = (x, y, z) => x + ',' + y + ',' + z;
function col(hex, j = 0.12) { return new THREE.Color(hex).multiplyScalar(1 - rnd() * j); }
function set(x, y, z, hex, j) { const k = key(x, y, z); glow.delete(k); vox.set(k, {x, y, z, c: col(hex, j)}); }
function halo(x, y, z, hex, size, k = 0, ph = Math.PI / 2) { halos.push({p: W(x, y, z), c: new THREE.Color(hex), size, k, ph}); }
function setGlow(x, y, z, hex, sc = 1) { const k = key(x, y, z); vox.delete(k); glow.set(k, {x, y, z, c: new THREE.Color(hex), sc}); }
function ball(cx, cy, cz, r, hex) {
  const m = Math.ceil(r) + 1;
  for (let x = -m; x <= m; x++) for (let y = -m; y <= m; y++) for (let z = -m; z <= m; z++) {
    const px = Math.round(cx) + x, py = Math.round(cy) + y, pz = Math.round(cz) + z;
    if ((px - cx) ** 2 + (py - cy) ** 2 + (pz - cz) ** 2 <= r * r && py >= 0) set(px, py, pz, hex, 0.05);
  }
}
const SNOW = 0xeef3ff;

// ---------- ground ----------
for (let x = -24; x <= 24; x++) for (let z = -24; z <= 24; z++) {
  for (let y = -8; y <= -1; y++) {
    const l = W(x, y, z).length();
    if (l < RIN && (y === -1 || l > RIN - 0.65)) set(x, y, z, SNOW, 0.07);
  }
  const r = Math.hypot(x, z);
  if (r > 13) {
    const n = Math.sin(x * 0.5 + 1) * Math.cos(z * 0.45) + Math.sin((x + z) * 0.3);
    if (n > 0.5 && W(x, 0, z).length() < RIN) set(x, 0, z, SNOW, 0.07);
    if (n > 1.25 && W(x, 1, z).length() < RIN) set(x, 1, z, SNOW, 0.07);
  }
}

// ---------- cabin ----------
for (let x = -11; x <= -1; x++) for (let z = -9; z <= -1; z++) for (let y = 0; y <= 5; y++) {
  const ex = x === -11 || x === -1, ez = z === -9 || z === -1;
  if (!ex && !ez) continue;
  set(x, y, z, ex && ez ? 0x3e2413 : (y % 2 ? 0x6b4226 : 0x5a3520), 0.1);
}
for (let x = -7; x <= -5; x++) for (let y = 0; y <= 3; y++) set(x, y, -1, 0x8b1a1a, 0.06);
set(-5, 1, 0, 0xe0b040, 0);
set(-7, 2, 0, 0x1f7a34); set(-5, 2, 0, 0x1f7a34); set(-6, 1, 0, 0x1f7a34); set(-6, 3, 0, 0xd0202a, 0);
const WIN = 0xffc45e;
for (const x0 of [-10, -3]) { for (let x = x0; x <= x0 + 1; x++) for (let y = 2; y <= 3; y++) setGlow(x, y, -1, WIN); halo(x0 + 0.5, 2.5, 0.4, 0xff9a30, 3.4); }
for (const xs of [-1, -11]) { for (let z = -6; z <= -4; z++) for (let y = 2; y <= 3; y++) setGlow(xs, y, z, WIN); halo(xs + (xs === -1 ? 1.4 : -1.4), 2.5, -5, 0xff9a30, 3.6); }
for (let i = 0; i <= 5; i++) {
  const z0 = -10 + i, z1 = -i;
  for (let x = -12; x <= 0; x++) for (let z = z0; z <= z1; z++) {
    const edge = z === z0 || z === z1;
    set(x, 6 + i, z, edge && i > 0 ? SNOW : 0xa3222a, 0.07);
  }
}
for (let x = -9; x <= -8; x++) for (let z = -7; z <= -6; z++) { for (let y = 6; y <= 12; y++) set(x, y, z, 0x7d3b2c, 0.18); set(x, 13, z, SNOW, 0.04); }
const LC = [0xff3b30, 0xffc23a, 0x3aa0ff, 0xff6ad5, 0x5dff7a];
for (let x = -12, i = 0; x <= 0; x += 2, i++) { const c = LC[i % LC.length]; setGlow(x, 5, 0, c, 0.55); halo(x, 5, 0.7, c, 1.3, 2 + i % 3, i * 1.7); }
// candy canes
for (const [cx, d] of [[-9, 1], [-3, -1]]) { for (let y = 0; y <= 4; y++) set(cx, y, 1, y % 2 ? 0xd8202a : 0xffffff, 0); set(cx + d, 4, 1, 0xd8202a, 0); }

// ---------- trees ----------
function fir(cx, cz, radii, y0, lightP) {
  for (let y = 0; y < y0; y++) set(cx, y, cz, 0x4a2c17);
  radii.forEach((r, j) => {
    const rn = radii[j + 1] || 0, m = Math.ceil(r);
    for (let dx = -m; dx <= m; dx++) for (let dz = -m; dz <= m; dz++) {
      const d2 = dx * dx + dz * dz;
      if (d2 > r * r + 0.5) continue;
      const outer = d2 > (r - 1) * (r - 1), exposed = d2 > rn * rn + 0.5;
      const a = rnd(), b = rnd();
      if (exposed && a < 0.5) set(cx + dx, y0 + j, cz + dz, SNOW, 0.05);
      else if (outer && d2 > 0 && b < lightP) {
        const c = LC[Math.floor(rnd() * LC.length)], l = Math.sqrt(d2);
        setGlow(cx + dx, y0 + j, cz + dz, c, 0.8);
        halo(cx + dx + dx / l * 0.9, y0 + j, cz + dz + dz / l * 0.9, c, 1.5, 2 + Math.floor(rnd() * 3), rnd() * 6.28);
      } else set(cx + dx, y0 + j, cz + dz, rnd() < 0.5 ? 0x1c6b33 : 0x14552a, 0.15);
    }
  });
}
fir(6, 2, [5, 4.2, 3.2, 2.2, 4, 3.2, 2.2, 1.5, 3, 2.2, 1.5, 1, 1], 3, 0.3);
for (const [x, y] of [[6, 17], [5, 17], [7, 17], [6, 18], [6, 16]]) setGlow(x, y, 2, 0xffe27a, 1);
halo(6, 17, 2, 0xffc840, 5.5, 2, 0);
fir(10, -12, [3, 2.2, 1.4, 2.2, 1.4, 1, 1], 1, 0);
fir(15, -4, [2.2, 1.4, 2, 1.4, 1], 1, 0);
fir(-16, -3, [3, 2.2, 1.4, 2.2, 1.4, 1, 1], 1, 0);
fir(-9, 14, [2.2, 1.4, 2, 1.4, 1], 1, 0);

// ---------- presents ----------
function box(x0, y0, z0, w, h, d, hex, rib) {
  for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) for (let z = 0; z < d; z++)
    set(x0 + x, y0 + y, z0 + z, (x === (w >> 1) || z === (d >> 1)) ? rib : hex, 0.04);
}
box(8, 0, 5, 3, 2, 3, 0xd0202a, 0xf2c14a);
box(4, 0, 6, 3, 2, 3, 0x1f8a3d, 0xffffff);
box(1, 0, 1, 3, 3, 3, 0x2a5fd0, 0xf2c14a);
box(11, 0, 1, 3, 2, 3, 0x8a2fc0, 0xffe27a);

// ---------- snowman ----------
{
  const cx = -3, cz = 10;
  ball(cx, 1.5, cz, 2.3, 0xf6f9ff);
  ball(cx, 4.5, cz, 1.7, 0xf6f9ff);
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    set(cx + dx, 6, cz + dz, 0xd0202a, 0.05);
    for (let y = 7; y <= 9; y++) set(cx + dx, y, cz + dz, 0xf6f9ff, 0.04);
    set(cx + dx, 11, cz + dz, 0xc0202a, 0.04);
    set(cx + dx, 12, cz + dz, 0x17181c, 0.04);
  }
  for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) if (Math.abs(dx) + Math.abs(dz) <= 3) set(cx + dx, 10, cz + dz, 0x17181c, 0.04);
  set(cx - 1, 9, cz + 1, 0x101014, 0); set(cx + 1, 9, cz + 1, 0x101014, 0);
  set(cx, 8, cz + 2, 0xff7a1a, 0);
  set(cx, 4, cz + 1, 0x101014, 0); set(cx, 2, cz + 2, 0x101014, 0);
  set(cx + 1, 5, cz + 1, 0xd0202a, 0); set(cx + 1, 4, cz + 1, 0xd0202a, 0);
  set(cx - 2, 5, cz, 0x4a2c17); set(cx - 3, 6, cz, 0x4a2c17); set(cx + 2, 5, cz, 0x4a2c17); set(cx + 3, 6, cz, 0x4a2c17);
}

// ---------- lamp post ----------
{
  const lx = -15, lz = 6;
  for (let y = 0; y <= 7; y++) set(lx, y, lz, 0x22252b, 0.05);
  setGlow(lx, 8, lz, 0xffd27a, 1);
  halo(lx, 8, lz, 0xffb050, 4.2, 1, 1);
  for (const [dx, dz] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) set(lx + dx, 9, lz + dz, 0x22252b, 0.05);
  set(lx, 10, lz, SNOW, 0);
}

// ---------- build voxel meshes ----------
const cube = new THREE.BoxGeometry(S, S, S);
const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), SC = new THREE.Vector3(), E = new THREE.Euler();
{
  const list = [...vox.values()];
  const mesh = new THREE.InstancedMesh(cube, new THREE.MeshStandardMaterial({roughness: 0.85, metalness: 0}), list.length);
  list.forEach((v, i) => { M4.makeTranslation(v.x * S, GY + (v.y + 0.5) * S, v.z * S); mesh.setMatrixAt(i, M4); mesh.setColorAt(i, v.c); });
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  const gl2 = [...glow.values()];
  const gm = new THREE.InstancedMesh(cube, new THREE.MeshBasicMaterial({toneMapped: false}), gl2.length);
  gl2.forEach((v, i) => { M4.compose(W(v.x, v.y, v.z), Q.identity(), SC.setScalar(v.sc)); gm.setMatrixAt(i, M4); gm.setColorAt(i, v.c); });
  scene.add(gm);
}

// ---------- halos ----------
const haloMat = new THREE.ShaderMaterial({
  uniforms: {uT: {value: 0}},
  vertexShader: `uniform float uT; attribute vec3 aCol; attribute float aSize, aPh, aK; varying vec3 vC;
    void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); float tw = 0.7+0.3*sin(6.2831853*aK*uT/10.+aPh);
    vC = aCol*tw; gl_PointSize = aSize*projectionMatrix[1][1]*400./-mv.z; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `varying vec3 vC; void main(){ float d = length(gl_PointCoord-0.5)*2.; float a = exp(-d*d*5.)*(1.-smoothstep(0.75,1.,d)); gl_FragColor = vec4(vC*a*0.75,1.); }`,
  blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
});
{
  const g = new THREE.BufferGeometry(), n = halos.length;
  const p = new Float32Array(n * 3), c = new Float32Array(n * 3), s = new Float32Array(n), ph = new Float32Array(n), k = new Float32Array(n);
  halos.forEach((h, i) => { h.p.toArray(p, i * 3); c[i * 3] = h.c.r; c[i * 3 + 1] = h.c.g; c[i * 3 + 2] = h.c.b; s[i] = h.size; ph[i] = h.ph; k[i] = h.k; });
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('aCol', new THREE.BufferAttribute(c, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(s, 1));
  g.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
  g.setAttribute('aK', new THREE.BufferAttribute(k, 1));
  const pts = new THREE.Points(g, haloMat); pts.frustumCulled = false; pts.renderOrder = 2;
  scene.add(pts);
}

// ---------- smoke ----------
const NS = 8;
const smoke = new THREE.InstancedMesh(cube, new THREE.MeshBasicMaterial({color: 0xb9c2d6, transparent: true, opacity: 0.4, depthWrite: false}), NS);
smoke.renderOrder = 1; smoke.frustumCulled = false; scene.add(smoke);

// ---------- snow ----------
const NF = 750, flakes = [];
for (let i = 0; i < NF; i++) {
  const a = rnd() * Math.PI * 2, r = 9.1 * Math.sqrt(rnd());
  flakes.push({x: Math.cos(a) * r, z: Math.sin(a) * r, top: Math.sqrt(9.35 * 9.35 - r * r), ph: rnd(), k: rnd() < 0.6 ? 1 : 2,
    sw: 0.15 + rnd() * 0.25, m: 1 + Math.floor(rnd() * 3), p2: rnd() * 6.28, sz: 0.2 + rnd() * 0.22, rk: 1 + Math.floor(rnd() * 3)});
}
const snow = new THREE.InstancedMesh(cube, new THREE.MeshBasicMaterial({color: 0xffffff}), NF);
snow.frustumCulled = false; scene.add(snow);

// ---------- glass ----------
const LDIR = new THREE.Vector3(10, 20, 14).normalize();
const glass = new THREE.Mesh(new THREE.SphereGeometry(10, 96, 64), new THREE.ShaderMaterial({
  uniforms: {uL: {value: LDIR}},
  vertexShader: `uniform vec3 uL; varying vec3 vN, vP, vL; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); vP = mv.xyz; vN = normalMatrix*normal; vL = (viewMatrix*vec4(uL,0.)).xyz; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `varying vec3 vN, vP, vL; void main(){ vec3 n = normalize(vN), v = normalize(-vP);
    float f = pow(1.-abs(dot(n,v)),2.5);
    vec3 h = normalize(normalize(vL)+v); float nh = max(dot(n,h),0.);
    float sp = pow(nh,500.)*1.6 + pow(nh,40.)*0.10;
    vec3 h2 = normalize(normalize(vec3(-.55,.6,.6))+v); float nh2 = max(dot(n,h2),0.);
    sp += pow(nh2,160.)*0.45 + pow(nh2,20.)*0.05;
    vec3 c = vec3(.5,.68,1.)*f*0.5 + vec3(1.)*sp + vec3(.03,.045,.07);
    gl_FragColor = vec4(c,1.); }`,
  blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
}));
glass.renderOrder = 5; scene.add(glass);

// ---------- base ----------
{
  const prof = [[0, -11.5], [9.6, -11.5], [9.6, -10.8], [8.9, -10.4], [8.6, -8.3], [8.0, -7.6], [7.35, -6.5], [6.6, -6.5], [0, -6.5]].map(p => new THREE.Vector2(p[0], p[1]));
  const base = new THREE.Mesh(new THREE.LatheGeometry(prof, 96), new THREE.MeshStandardMaterial({color: 0x7a1420, roughness: 0.38, metalness: 0.15, side: THREE.DoubleSide}));
  base.castShadow = true; base.receiveShadow = true; scene.add(base);
  const gold = new THREE.MeshStandardMaterial({color: 0xe0ae48, roughness: 0.3, metalness: 0.45, emissive: 0x3a2606});
  for (const [r, y, w] of [[9.45, -10.75, 0.28], [8.05, -7.6, 0.24], [7.3, -6.55, 0.2]]) {
    const t = new THREE.Mesh(new THREE.TorusGeometry(r, w, 14, 96), gold); t.rotation.x = Math.PI / 2; t.position.y = y; t.castShadow = true; scene.add(t);
  }
  const table = new THREE.Mesh(new THREE.CircleGeometry(90, 64), new THREE.MeshStandardMaterial({color: 0x241a14, roughness: 0.75}));
  table.rotation.x = -Math.PI / 2; table.position.y = -11.5; table.receiveShadow = true; scene.add(table);
}

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x8fa8ff, 0x1c1c2c, 0.75));
const moon = new THREE.DirectionalLight(0xc4d4ff, 1.4);
moon.position.copy(LDIR).multiplyScalar(40);
moon.castShadow = true; moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, {left: -15, right: 15, top: 15, bottom: -15, near: 5, far: 80});
moon.shadow.bias = -0.0005; moon.shadow.normalBias = 0.03;
scene.add(moon);
const pTree = new THREE.PointLight(0xffb060, 9, 14); pTree.position.copy(W(6, 9, 8)); scene.add(pTree);
const pStar = new THREE.PointLight(0xffd870, 6, 12); pStar.position.copy(W(6, 19, 3)); scene.add(pStar);
const pWin = new THREE.PointLight(0xff9030, 11, 14); pWin.position.copy(W(-6, 3, 3)); scene.add(pWin);
const pLamp = new THREE.PointLight(0xffc070, 9, 12); pLamp.position.copy(W(-14, 8, 7)); scene.add(pLamp);

// ---------- draw ----------
const TAU = Math.PI * 2;
window.__length = 10;
window.__draw = function (t) {
  t = ((t % 10) + 10) % 10;
  const u = t / 10;
  const a = TAU * u + Math.PI + 0.45;
  camera.position.set(Math.sin(a) * 37, 5.5 + Math.sin(TAU * u) * 1.5, Math.cos(a) * 37);
  camera.lookAt(0, -1.3, 0);
  haloMat.uniforms.uT.value = t;
  pTree.intensity = 9 + 1.5 * Math.sin(TAU * 3 * u);
  pWin.intensity = 11 + 1.5 * Math.sin(TAU * 4 * u + 1) + 0.8 * Math.sin(TAU * 7 * u);
  pStar.intensity = 6 + 1.5 * Math.sin(TAU * 2 * u);

  for (let i = 0; i < NS; i++) {
    const p = (i / NS + 2 * u) % 1;
    const pos = W(-8.5 + Math.sin(p * 6 + i) * p * 1.6, 13.6 + p * 9, -6.5 + Math.cos(p * 5 + i * 2) * p * 1.3);
    E.set(p * 2 + i, p * 3, i);
    M4.compose(pos, Q.setFromEuler(E), SC.setScalar((0.7 + 1.3 * p) * (1 - p * p * p)));
    smoke.setMatrixAt(i, M4);
  }
  smoke.instanceMatrix.needsUpdate = true;

  for (let i = 0; i < NF; i++) {
    const f = flakes[i];
    const p = (f.ph + f.k * u) % 1;
    const y = f.top - p * (f.top - GY);
    const sx = Math.sin(TAU * f.m * u + f.p2) * f.sw, sz = Math.cos(TAU * f.m * u + f.p2 * 1.7) * f.sw;
    E.set(TAU * f.rk * u + f.p2, TAU * f.m * u, f.p2);
    const fade = Math.min(1, p * 12, (1 - p) * 12);
    M4.compose(SC.set(f.x + sx, y, f.z + sz).clone(), Q.setFromEuler(E), SC.setScalar(f.sz * fade));
    snow.setMatrixAt(i, M4);
  }
  snow.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
  ctx.drawImage(gl, 0, 0, 800, 800);
};

if (location.search.includes('still')) {
  window.__draw(5);
} else {
  const loop = () => { window.__draw((performance.now() / 1000) % 10); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
